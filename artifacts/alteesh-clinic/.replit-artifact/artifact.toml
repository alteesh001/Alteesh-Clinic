kind = "web"
previewPath = "/"
title = "Alteesh Clinic"
description = "تطبيق إدارة عيادة أسنان عربي يعمل أوفلاين بالكامل، يحفظ البيانات محليًا ويقدم لوحة مدير ووضع طبيب وإدارة المرضى والمواعيد والمخزون والفواتير."
version = "1.0.0"
id = "artifacts/alteesh-clinic"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21610

[services.development]
run = "pnpm --filter @workspace/alteesh-clinic run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/alteesh-clinic", "run", "build" ]
serve = "static"
publicDir = "artifacts/alteesh-clinic/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21610"
BASE_PATH = "/"
